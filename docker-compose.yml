version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: resolvebridge_db
    environment:
      POSTGRES_USER: resolveuser
      POSTGRES_PASSWORD: resolvepassword
      POSTGRES_DB: resolvebridge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolveuser -d resolvebridge"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resolvebridge_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=resolvebridge;Username=resolveuser;Password=resolvepassword
      - Jwt__SecretKey=a_very_long_and_secure_secret_key_for_local_production_testing
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
